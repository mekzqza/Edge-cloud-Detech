# Cloudflare proxy คั่นอยู่ → $remote_addr ดิบ ๆ คือ IP ของ Cloudflare ไม่ใช่ของ client
# real_ip_header เปลี่ยน $remote_addr ให้เป็น IP จริง ทั้ง rate limit, log และ X-Real-IP ที่ส่งต่อ
# เชื่อ header นี้เฉพาะ request ที่มาจากช่วง IP ของ Cloudflare — ถ้าเชื่อทุก IP
# คนที่หา origin IP เจอแล้วยิงตรงจะปลอม CF-Connecting-IP หลบลิมิตได้ฟรี ๆ
# อัปเดตรายการ: curl -s https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ponytail: rate limit ที่ชั้น nginx — จุดเดียวที่รู้ IP จริงของ client
# (backend เห็นแต่ IP ของ container frontend) ทำงานคู่กับ lockout ต่อ username
# ใน backend/src/routes/auth.js ที่กันเดารหัสช้า ๆ อีกชั้น
# ปรับ rate/burst ได้ตามของจริง — 10r/m = 1 ครั้งทุก 6 วินาที ต่อ IP
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
	listen 80;
	server_name edge-cloud-detect.sukpat.dev;
	return 301 https://$host$request_uri;
}
server {
	listen 443 ssl;
	http2 on;
	server_name edge-cloud-detect.sukpat.dev;
	ssl_certificate     /etc/nginx/certs/origin.crt;
	ssl_certificate_key /etc/nginx/certs/origin.key;
	client_max_body_size 20m;
	resolver 127.0.0.11 valid=10s;
	set $frontend http://frontend:3000;
	set $backend  http://backend:3000;

	proxy_set_header Host              $host;
	proxy_set_header X-Real-IP         $remote_addr;
	proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_http_version 1.1;
	proxy_set_header Upgrade    $http_upgrade;
	proxy_set_header Connection "upgrade";

	# ทางเข้า login ของ browser จริง ๆ — NextAuth แล้วค่อยไป backend ต่อในวงใน
	# burst เผื่อคนพิมพ์รหัสผิดรัว ๆ ไม่ให้เด้ง 429 ใส่คนใช้จริง
	location = /api/auth/callback/credentials {
		limit_req zone=login burst=5 nodelay;
		proxy_pass $frontend$request_uri;
	}
	# /api/login ปกติถูกเรียกจาก frontend ในวงใน ไม่ผ่าน nginx —
	# ที่โผล่มาทางนี้คือคนยิงตรงจากข้างนอก เลยคุมแน่นกว่า
	location = /api/login {
		limit_req zone=login burst=2 nodelay;
		proxy_pass $backend$request_uri;
	}
	location /api/auth/ { proxy_pass $frontend$request_uri; }
	location /api/      { proxy_pass $backend$request_uri; }
	location /uploads/  { proxy_pass $backend$request_uri; }
	location /          { proxy_pass $frontend$request_uri; }
}
