server {
	listen 80;
	server_name edge-cloud-detech.sukpat.dev;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	http2 on;
	server_name edge-cloud-detech.sukpat.dev;

	# ใช้ Cloudflare Origin Certificate (ไม่ขอ Let's Encrypt เอง) — ไฟล์วางใน ./certs บนเซิร์ฟเวอร์
	ssl_certificate     /etc/nginx/certs/origin.crt;
	ssl_certificate_key /etc/nginx/certs/origin.key;

	# default 1m — รูปที่อัพโหลดจะโดน 413
	client_max_body_size 20m;

	# ponytail: resolver ของ docker + ตัวแปร = re-resolve IP ตอน container restart
	# (nginx resolve hostname ครั้งเดียวตอน start ถ้า proxy_pass เป็น literal)
	resolver 127.0.0.11 valid=10s;
	set $frontend http://frontend:3000;
	set $backend  http://backend:3000;

	proxy_set_header Host              $host;
	proxy_set_header X-Real-IP         $remote_addr;
	proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_http_version 1.1;
	proxy_set_header Upgrade    $http_upgrade;
	proxy_set_header Connection "upgrade";

	# NextAuth → frontend (longest-prefix ชนะ /api/ ข้างล่างเอง)
	location /api/auth/ { proxy_pass $frontend$request_uri; }

	# API → backend (คงพาธเดิม ไม่ตัด /api)
	location /api/      { proxy_pass $backend$request_uri; }

	# รูปที่อัพโหลด → backend
	location /uploads/  { proxy_pass $backend$request_uri; }

	# ที่เหลือ = Next.js server
	location /          { proxy_pass $frontend$request_uri; }
}
