server {
	listen 80;
	server_name edge-cloud-detect.sukpat.dev;
	return 301 https://$host$request_uri;
}
server {
	listen 443 ssl;
	http2 on;
	server_name edge-cloud-detect.sukpat.dev;
	ssl_certificate     /etc/nginx/certs/origin.crt;
	ssl_certificate_key /etc/nginx/certs/origin.key;
	client_max_body_size 20m;
	resolver 127.0.0.11 valid=10s;
	set $frontend http://frontend:3000;
	set $backend  http://backend:3000;

	proxy_set_header Host              $host;
	proxy_set_header X-Real-IP         $remote_addr;
	proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_http_version 1.1;
	proxy_set_header Upgrade    $http_upgrade;
	proxy_set_header Connection "upgrade";

	location /api/auth/ { proxy_pass $frontend$request_uri; }
	location /api/      { proxy_pass $backend$request_uri; }
	location /uploads/  { proxy_pass $backend$request_uri; }
	location /          { proxy_pass $frontend$request_uri; }
}
